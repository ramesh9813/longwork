# Render Blueprint: backend (Web Service) + frontend (Static Site)
# Docs: https://render.com/docs/blueprint-spec
# After pushing this repo to GitHub, either:
#   1) Dashboard -> New -> Blueprint -> select repo, or
#   2) CLI (needs --repo): see commands at bottom.
services:
  # ---------- Backend: Express + TypeScript ----------
  - type: web
    name: longworkapi
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://longwork.onrender.com
      # Firebase Admin (fill in dashboard, never commit secrets):
      # - key: FIREBASE_SERVICE_ACCOUNT_JSON
      #   sync: false
      # - key: FIREBASE_PROJECT_ID
      #   sync: false
      # - key: FIREBASE_CLIENT_EMAIL
      #   sync: false
      # - key: FIREBASE_PRIVATE_KEY
      #   sync: false

  # ---------- Frontend: React + Vite Static Site ----------
  # Single-word URL, no numbers/symbols: https://longwork.onrender.com
  # Fallback if taken at creation: larger (https://larger.onrender.com)
  - type: web
    name: longwork
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://longworkapi.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
